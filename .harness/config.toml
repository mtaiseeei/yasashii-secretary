# SETTINGS
# Allowed version: 1. Lifecycle: "balanced" or "fresh".
# Role model/effort values are explicit settings or "inherit"; see REFERENCE below.

version = 1

lifecycle = "balanced"

[hosts.claudeCode.roles.planner]
model = "inherit"
effort = "inherit"

[hosts.claudeCode.roles.generator]
model = "inherit"
effort = "inherit"

[hosts.claudeCode.roles.evaluator]
model = "inherit"
effort = "inherit"

[hosts.codex.roles.planner]
model = "gpt-5.6-sol"
effort = "high"

[hosts.codex.roles.generator]
model = "gpt-5.6-luna"
effort = "xhigh"

[hosts.codex.roles.generator.escalation]
model = "gpt-5.6-sol"
effort = "high"
after_failures = 2
on_evaluator_recommendation = true

[hosts.codex.roles.evaluator]
model = "gpt-5.6-sol"
effort = "high"

[limits]
max_lineage_dispatches = 10
max_spec_issue_returns = 2

# REFERENCE
# ============================================================

# This shared file expresses repository runtime intent. Put personal leaf-only overrides in the
# git-ignored .harness/config.local.toml. Resolution order is personal, shared, then plugin default.

# AI editing contract: when the user asks an AI agent to change model or effort, it must consult the
# current official reference for that host below and copy the exact supported model ID, alias, and effort.
# Never guess, fuzzy-match, translate between hosts, or replace a requested value with a similar name.
# If the exact value cannot be confirmed, preserve the current value (or use "inherit" for a new leaf)
# and report that it was not changed. Documentation confirms spelling, not access on the current host.

# "inherit" sends no role override. The role uses the parent main session (the current chat) or host default.
# The Orchestrator is the current main chat; this file cannot change that chat's model.

# "balanced" reuses a role only when host metadata verifies model/effort-preserving resume.
# "fresh" starts new Generator and Evaluator work units at a Sprint boundary. The roles remain separate.

# All distributed Codex role leaves inherit by default. Explicit settings use the standard/strong routing rules.
# Automatic routing uses configured role values or host defaults; it does not invent model choices.

# A displayed Codex spawn schema may omit model and effort even when the runtime parser accepts them.
# Try the resolver's exact dispatch-attempt values once on the built-in/default role, passing model and reasoning_effort directly.
# Resolver output is not launch proof; launch-verified requires matching child host metadata or a host trace.

# Official references:
# OpenAI API model IDs and capabilities: https://developers.openai.com/api/docs/models
# Codex model availability: https://developers.openai.com/codex/models
# Codex model/effort configuration: https://developers.openai.com/codex/config-reference
# Codex subagent controls and limits: https://developers.openai.com/codex/subagents
# Anthropic model IDs and capabilities: https://docs.anthropic.com/en/docs/about-claude/models/overview
# Claude Code model selection/configuration: https://code.claude.com/docs/en/model-config
# Claude Code subagent model controls: https://code.claude.com/docs/en/sub-agents
